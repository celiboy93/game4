<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Settings</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        h2 { color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2196F3; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button.red { background: #d32f2f; }
        .info-item { margin-bottom: 15px; font-size: 16px; }
        .info-item strong { color: #ccc; display: inline-block; width: 100px; }
        .back-btn { background: #4caf50; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>USER PROFILE</h1>

    <div class="box">
        <h2>ACCOUNT INFO</h2>
        <div class="info-item"><strong>Username:</strong> <span id="usernameDisplay">Loading...</span></div>
        <div class="info-item"><strong>Current Balance:</strong> <span id="balanceDisplay">Loading...</span></div>
    </div>

    <div class="box">
        <h2>CHANGE PASSWORD</h2>
        <input type="password" id="oldPass" placeholder="Old Password" required>
        <input type="password" id="newPass" placeholder="New Password" required>
        <button onclick="changePassword()">UPDATE PASSWORD</button>
    </div>

    <button class="back-btn" onclick="location.href='/'">← Back to Shop</button>

    <script>
        async function loadProfile() {
            const res = await fetch('/api/me');
            if(!res.ok) { location.href = '/login'; return; }
            const user = await res.json();
            
            document.getElementById('usernameDisplay').textContent = user.username;
            document.getElementById('balanceDisplay').textContent = `${user.balance} MMK`;
        }

        async function changePassword() {
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;

            if (oldPass.length < 3 || newPass.length < 3) {
                alert("Password must be at least 3 characters.");
                return;
            }

            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ old_password: oldPass, new_password: newPass })
            });

            if (res.ok) {
                alert("Password successfully updated! Please re-login.");
                location.href = '/api/auth/logout';
            } else {
                const errorText = await res.text();
                alert("ERROR: " + errorText);
            }
        }

        loadProfile();
    </script>
</body>
</html>
