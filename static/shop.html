<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key & Code Generator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .section { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .section h2 { color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .action-btn { width: 100%; padding: 15px; margin-top: 15px; font-size: 18px; font-weight: bold; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        .inp-field, select { width: 100%; padding: 10px; margin: 5px 0; background: #333; border: 1px solid #555; color: white; border-radius: 5px; box-sizing: border-box; }
        
        /* Modal Styles (Required for history) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: #222; padding: 25px; width: 90%; max-width: 400px; border-radius: 10px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .success-box { background: #1a1a1a; border: 2px solid #4CAF50; box-shadow: 0 0 20px rgba(76, 175, 80, 0.4); padding: 30px 20px; }
        .success-icon { font-size: 50px; color: #ffd700; margin-bottom: 15px; } 
        .code-display { background: #000; color: #0f0; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; word-break: break-all; border: 1px dashed #4CAF50; }
        .copy-btn { background: #2196F3; color: white; border: none; padding: 10px 0; width: 100%; margin-top: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .close-btn { background: #555; color: white; border: none; padding: 10px 0; width: 100%; margin-top: 10px; border-radius: 5px; cursor: pointer; }
        
        /* History Table Styles */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .history-table th, .history-table td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 12px; }
        .history-table th { background: #444; color: #ffd700; }
        .history-code { font-family: monospace; color: #0f0; }

        /* Admin Icon in Header */
        #adminIcon { font-size: 20px; cursor: pointer; color: #ff6f00; margin-right: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔑 CODE GEN SHOP</div>
        <div style="display: flex; align-items: center;">
            <span id="adminIcon">⚙️</span>
            <div class="balance" id="userBalance" onclick="location.href='/profile'" style="cursor: pointer;">Loading...</div>
        </div>
    </header>

    <div class="container" style="padding: 15px;">
        
        <div class="section">
            <h2>GENERATE NEW CODE</h2>
            <p style="color:#aaa;">Select the type of code you need to generate. Price will be deducted from your wallet.</p>
            
            <select id="codeType" class="inp-field">
                <option value="">Select Item</option>
            </select>
            
            <button id="generateBtn" class="action-btn" style="background: #4CAF50;">GENERATE CODE NOW</button>
        </div>
        
        <div id="adminArea" style="display: none;">
            </div>

        <div class="section">
            <h2>CURRENT ITEM STOCK</h2>
            <div id="itemListDisplay">Loading items...</div>
        </div>


        <div class="grid-3" style="margin-top: 20px;">
            <button onclick="showHistory()" style="background: #2196F3;">📜 History</button>
            <button onclick="location.href='/profile'" style="background: #673AB7;">⚙️ Profile</button>
            <button onclick="location.href='/api/auth/logout'" style="background:#d32f2f;">Logout</button>
        </div>

    </div>

    <div id="successModal" class="modal">
        <div class="modal-content"><h2 style="color: #0f0;">SUCCESS!</h2><p>Your new code is:</p><div id="purchasedCodeDisplay" class="result-code"></div><button class="copy-btn" onclick="copyCode()">COPY CODE</button><button class="close-btn" onclick="closeModal('successModal')">CLOSE</button></div>
    </div>
    <div id="historyModal" class="modal">
        <div class="modal-content"><h2 style="color: #ffd700; margin-top: 0;">MY ORDERS</h2><div id="historyList">Loading...</div><button class="close-btn" onclick="closeModal('historyModal')">CLOSE</button></div>
    </div>
    
    <script>
        
        let allItems = [];

        function toggleAdminPanel() {
            const adminArea = document.getElementById('adminArea');
            if (adminArea.style.display === 'none' || adminArea.style.display === '') {
                adminArea.style.display = 'block';
            } else {
                adminArea.style.display = 'none';
            }
        }
        
        function showAdminTools(isAdmin) {
            document.getElementById('adminArea').style.display = 'none';
            document.getElementById('adminIcon').style.display = isAdmin ? 'block' : 'none';
        }

        async function loadItemsAndUI() {
            const itemRes = await fetch('/api/items');
            const items = await itemRes.json();
            allItems = items;

            // 1. Populate simple SELECT dropdown
            const select = document.getElementById('codeType');
            select.innerHTML = '<option value="">Select Item</option>';
            
            // 2. Render Visible Item List
            const listDisplay = document.getElementById('itemListDisplay');
            listDisplay.innerHTML = '';

            if (items.length === 0) {
                listDisplay.innerHTML = '<p style="color:red; font-weight:bold;">No items in stock. Add items via ADMIN TOOLS.</p>';
                select.innerHTML = '<option value="">No items available</option>';
                return;
            }

            let itemHtml = '<ul style="list-style: none; padding-left: 0;">';
            items.forEach(item => {
                // Populate Dropdown
                select.innerHTML += `<option value="${item.name}">${item.name} (${item.price})</option>`;
                
                // Populate Visible List (Simplified text display for stability)
                itemHtml += `<li style="color: ${item.stock > 0 ? '#0F0' : '#FF6347'}; padding: 5px;">${item.name} - Stock: ${item.stock}</li>`;
            });
            listDisplay.innerHTML = itemHtml + '</ul>';
        }
        
        async function init() {
            const userRes = await fetch('/api/me');
            if(!userRes.ok) { location.href = '/login'; return; }
            const user = await userRes.json();
            
            document.getElementById('userBalance').innerHTML = `${user.username.toUpperCase()} | <span style="color:#0f0">${user.balance} MMK</span>`;
            
            showAdminTools(user.username === 'admin');
            
            await loadItemsAndUI();
        }

        // --- Utility & Modal Functions ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none';
        }
        function copyCode() { 
            const code = document.getElementById('purchasedCodeDisplay').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied!');
            });
        }
        
        async function showHistory() {
            openModal('historyModal');
            const listContainer = document.getElementById('historyList');
            listContainer.innerHTML = 'Loading...';

            const res = await fetch('/api/history');
            const data = await res.json();

            listContainer.innerHTML = '';
            if(data.length === 0) { listContainer.innerHTML = '<p style="text-align:center;">No purchases yet.</p>'; return; }
            
            let tableHtml = '<table class="history-table"><thead><tr><th>Item</th><th>Code</th><th>Price</th></tr></thead><tbody>';
            data.forEach(record => {
                tableHtml += `
                    <tr>
                        <td>${record.itemName}</td>
                        <td class="history-code">${record.code}</td>
                        <td>${record.price}</td>
                    </tr>
                `;
            });
            tableHtml += '</tbody></table>';

            listContainer.innerHTML = tableHtml;
        }

        // --- Event Handlers (Unchanged Logic, Simplified UI) ---
        
        document.getElementById('adminIcon').addEventListener('click', toggleAdminPanel);

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const codeType = document.getElementById('codeType').value; // Read from simple select
            if (!codeType || codeType === 'No items available' || codeType === 'Select Item') { alert("Please select an item."); return; }
            
            const res = await fetch('/api/buy', {
                method: 'POST',
                body: JSON.stringify({ itemName: codeType }) 
            });
            const result = await res.json();
            
            if (result.success) {
                document.getElementById('purchasedCodeDisplay').textContent = result.code;
                openModal('successModal');
                init();
            } else {
                alert("Failed: " + (result.error || "Unknown Error. Check Admin Stock."));
            }
        });
        
        document.getElementById('addStockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('stockName').value;
            const price = document.getElementById('stockPrice').value;
            const imageUrl = document.getElementById('imageUrl').value;
            
            const data = {
                category: document.getElementById('stockCategory').value,
                name: name,
                price: price + " MMK",
                imageUrl: imageUrl, 
                stock: document.getElementById('stockCodes').value.split('\n').filter(s => s.trim() !== "")
            };

            const res = await fetch('/api/add-item', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if (res.ok) {
                alert(`Stock for ${name} Added!`);
            } else {
                alert("Failed to add stock.");
            }
            e.target.reset();
            init();
        });

        document.getElementById('topupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('topupUser').value;
            const a = document.getElementById('topupAmount').value;

            const res = await fetch('/api/admin/topup', { method: 'POST', body: JSON.stringify({ username: u, amount: a }) });
            if (res.ok) {
                alert("Topup Success!");
            } else {
                alert("Topup Failed!");
            }
            e.target.reset();
            init();
        });
        
        document.getElementById('topupUser').value = 'admin'; 

        init();
    </script>
</body>
</html>
