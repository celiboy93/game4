<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key & Code Generator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .section { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .section h2 { color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .action-btn { width: 100%; padding: 15px; margin-top: 15px; font-size: 18px; font-weight: bold; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        .inp-field, select { width: 100%; padding: 10px; margin: 5px 0; background: #333; border: 1px solid #555; color: white; border-radius: 5px; box-sizing: border-box; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .modal-content { background: #222; padding: 25px; width: 90%; max-width: 400px; border-radius: 10px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .result-code { background: #000; color: #0f0; padding: 10px; border-radius: 5px; margin: 15px 0; font-family: monospace; word-break: break-all; }
        .delete-btn { background: #d32f2f; color: white; }

        /* Admin Icon in Header */
        #adminIcon { font-size: 20px; cursor: pointer; color: #ff6f00; margin-right: 10px; display: none; }
        
        /* Custom Dropdown/Selector Styles */
        #selectButton { background: #333; color: white; text-align: left; border: 1px solid #555; padding: 12px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .custom-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: #333;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-item-row:hover { background: #444; }
        .item-detail { display: flex; align-items: center; }
        .item-price { color: #ffd700; font-weight: bold; }
        .item-image { width: 30px; height: 30px; object-fit: cover; margin-right: 10px; border-radius: 5px; }
        .stock-label { font-size: 10px; color: #0f0; margin-left: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔑 CODE GEN SHOP</div>
        <div style="display: flex; align-items: center;">
            <span id="adminIcon">⚙️</span>
            <div class="balance" id="userBalance" onclick="location.href='/profile'" style="cursor: pointer;">Loading...</div>
        </div>
    </header>

    <div class="container" style="padding: 15px;">
        
        <div class="section">
            <h2>GENERATE NEW CODE</h2>
            <p style="color:#aaa;">Select the type of code you need to generate. Price will be deducted from your wallet.</p>
            
            <div id="selectButton" onclick="openModal('customSelectorModal')">
                <span id="selectedItemText">Select Item</span>
                <span>▼</span>
                <input type="hidden" id="selectedItemName">
            </div>

            <button id="generateBtn" class="action-btn" style="background: #4CAF50;">GENERATE CODE NOW</button>
        </div>
        
        <div id="adminArea" style="display: none;">
            </div>

        <div class="section">
            <h2>CURRENT ITEM STOCK</h2>
            <div id="itemListDisplay">Loading items...</div>
        </div>


        <div class="grid-3" style="margin-top: 20px;">
            <button onclick="showHistory()" style="background: #2196F3;">📜 History</button>
            <button onclick="location.href='/profile'" style="background: #673AB7;">⚙️ Profile</button>
            <button onclick="location.href='/api/auth/logout'" style="background:#d32f2f;">Logout</button>
        </div>

    </div>

    <div id="successModal" class="modal">
        <div class="modal-content"><h2 style="color: #0f0;">SUCCESS!</h2><p>Your new code is:</p><div id="purchasedCodeDisplay" class="result-code"></div><button class="copy-btn" onclick="copyCode()">COPY CODE</button><button class="close-btn" onclick="closeModal('successModal')">CLOSE</button></div>
    </div>
    <div id="historyModal" class="modal">
        <div class="modal-content"><h2 style="color: #ffd700; margin-top: 0;">MY ORDERS</h2><div id="historyList">Loading...</div><button class="close-btn" onclick="closeModal('historyModal')">CLOSE</button></div>
    </div>
    
    <div id="customSelectorModal" class="modal">
        <div class="modal-content" style="background:#1e1e1e;">
            <h2 style="color:#ffd700;">SELECT ITEM</h2>
            <div id="customSelectorList">Loading items...</div>
            <button class="close-btn" onclick="closeModal('customSelectorModal')">CANCEL</button>
        </div>
    </div>

    
    <script>
        
        let allItems = [];

        function toggleAdminPanel() { /* ... */ } // Logic remains unchanged
        function showAdminTools(isAdmin) { /* ... */ } // Logic remains unchanged

        function selectItem(name, price) {
            document.getElementById('selectedItemText').textContent = `${name} (${price})`;
            document.getElementById('selectedItemName').value = name;
            closeModal('customSelectorModal');
        }

        async function loadItemsAndUI() {
            const itemRes = await fetch('/api/items');
            const items = await itemRes.json();
            allItems = items;

            // 1. Populate Custom Selector Modal
            const selectorList = document.getElementById('customSelectorList');
            selectorList.innerHTML = '';
            
            // 2. Render Visible Item List
            const listDisplay = document.getElementById('itemListDisplay');
            listDisplay.innerHTML = '';

            if (items.length === 0) {
                listDisplay.innerHTML = '<p style="color:red; font-weight:bold;">No items in stock. Add items via ADMIN TOOLS.</p>';
                selectorList.innerHTML = '<p style="text-align:center;">No items available</p>';
                return;
            }
            
            let itemHtml = '<ul style="list-style: none; padding-left: 0;">';
            items.forEach(item => {
                // Determine stock status
                const stockStatus = item.stock > 0 ? `<span style="color:#0f0;">Stock: ${item.stock}</span>` : `<span style="color:red;">Out of Stock</span>`;
                
                // Image Tag Logic
                const imageTag = item.imageUrl ? 
                    `<img src="${item.imageUrl}" class="item-image" onerror="this.style.display='none';" alt="${item.name}">` 
                    : `<span class="item-image" style="background:#555;">${item.category.toUpperCase()}</span>`;

                // Add to Custom Selector Modal
                const itemRow = document.createElement('div');
                itemRow.className = 'custom-item-row';
                itemRow.setAttribute('onclick', `selectItem('${item.name}', '${item.price}')`);
                itemRow.innerHTML = `
                    <div class="item-detail">
                        ${imageTag}
                        <span>${item.name}</span>
                        <span class="stock-label">${stockStatus}</span>
                    </div>
                    <span class="item-price">${item.price}</span>
                `;
                selectorList.appendChild(itemRow);


                // Add to Visible List
                itemHtml += `
                    <li style="display: flex; align-items: center; margin-bottom: 8px; font-weight: bold; color: ${item.stock > 0 ? '#0F0' : '#FF6347'};">
                        ${imageTag}
                        <span>${item.name} - Stock: ${item.stock}</span>
                    </li>
                `;
            });
            listDisplay.innerHTML = itemHtml + '</ul>';

            // Set initial selected item to the first available item if no item is selected
            if (allItems.length > 0) {
                 selectItem(allItems[0].name, allItems[0].price);
            }
        }
        
        async function init() { /* ... */ }
        function openModal(id) { /* ... */ }
        function closeModal(id) { /* ... */ }
        function copyCode() { /* ... */ }
        async function showHistory() { /* ... */ }
        
        // --- Core Buy Function (Updated to read hidden field) ---
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const codeType = document.getElementById('selectedItemName').value; // Read from hidden field
            if (!codeType || codeType === 'No items available') { alert("Please select an item."); return; }
            
            const res = await fetch('/api/buy', {
                method: 'POST',
                body: JSON.stringify({ itemName: codeType }) 
            });
            const result = await res.json();
            
            if (result.success) {
                document.getElementById('purchasedCodeDisplay').textContent = result.code;
                openModal('successModal');
                init();
            } else {
                alert("Failed: " + (result.error || "Unknown Error. Check Admin Stock."));
            }
        });
        
        // --- Admin Handlers (Omitted for brevity, but full code contains them) ---

        document.getElementById('topupUser').value = 'admin'; 

        init();
    </script>
</body>
</html>
