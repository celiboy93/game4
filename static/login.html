<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pro Shop</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 300px; border: 1px solid #333; text-align: center; }
        h2 { color: #ffd700; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ffd700; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .link { margin-top: 15px; font-size: 14px; color: #888; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box" id="loginBox">
        <h2>LOGIN</h2>
        <input type="text" id="l_user" placeholder="Username">
        <input type="password" id="l_pass" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <div class="link" onclick="toggle()">Create new account</div>
    </div>

    <div class="box" id="regBox" style="display: none;">
        <h2>REGISTER</h2>
        <input type="text" id="r_user" placeholder="Username">
        <input type="password" id="r_pass" placeholder="Password">
        <button onclick="register()">REGISTER</button>
        <div class="link" onclick="toggle()">Back to Login</div>
    </div>

    <script>
        function toggle() {
            const l = document.getElementById('loginBox');
            const r = document.getElementById('regBox');
            if(l.style.display === 'none') { l.style.display = 'block'; r.style.display = 'none'; }
            else { l.style.display = 'none'; r.style.display = 'block'; }
        }

        async function register() {
            const u = document.getElementById('r_user').value;
            const p = document.getElementById('r_pass').value;
            if(!u || !p) return alert("Enter all fields");

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({ username: u, password: p })
            });
            if(res.ok) { alert("Success! Please Login."); toggle(); }
            else alert("Username already exists.");
        }

        async function login() {
            const u = document.getElementById('l_user').value;
            const p = document.getElementById('l_pass').value;
            
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username: u, password: p })
            });

            if(res.ok) {
                location.href = '/'; 
            } else {
                alert("Wrong username or password");
            }
        }
    </script>
</body>
</html>
